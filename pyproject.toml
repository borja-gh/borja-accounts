[project]
name = "borja-accounts"
version = "0.1.0b2"
description = "Panel de control financiero personal — cuentas y cartera de inversión"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.24.0",
    "httpx>=0.28.1",
    "pandas>=2.3,<3.0",
    "uvicorn[standard]>=0.52.4",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false
