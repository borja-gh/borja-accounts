<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuentas</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a1a1a'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='system-ui,sans-serif' font-size='16' font-weight='700' fill='%23fff'%3EC%3C/text%3E%3C/svg%3E">
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap');

    :root {
      color-scheme: light;
      --bg: #F5F4F1;
      --surface: #ffffff;
      --surface2: #F1F0EC;
      --border: #E2E0D9;
      --text: #141414;
      --muted: #6F6E6A;
      --green: #1a7f37;
      --green-bright: #346538;
      --red: #cf222e;
      --red-bright: #9F2F2D;
      --blue: #0969da;
      --purple: #8250df;
      --yellow: #9a6700;
      --radius: 12px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.03);
      --shadow-md: 0 2px 8px rgba(0,0,0,0.04);
      --ink: #1a1a1a;
      --accent: #2c2a26;
      --accent-soft: rgba(44,42,38,0.08);
    }

    body.acc-openbank {
      --accent: #8B5E3C;
      --accent-soft: rgba(139,94,60,0.10);
      --bg: #F6F3EF;
    }
    body.acc-ibkr {
      --accent: #2F5D50;
      --accent-soft: rgba(47,93,80,0.10);
      --bg: #F2F5F3;
    }

    html { scroll-behavior: smooth; }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      min-height: 100vh;
      transition: background .25s ease;
    }

    /* ── BRAND MARKS ── */
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .mark {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      display: block;
    }
    .mark-sm { width: 18px; height: 18px; }
    .tab-inner {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .account-hero {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
      padding: 4px 0 2px;
    }
    .account-hero .mark { width: 36px; height: 36px; }
    .account-hero h2 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1.15;
    }
    .account-hero p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ── HEADER ── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 28px;
      display: flex;
      align-items: center;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.35px; }

    .patrimonio-pill {
      font-size: 12px;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 4px 12px;
      border-radius: 999px;
    }
    .patrimonio-pill b { color: var(--text); font-weight: 600; }

    .spacer { flex: 1; }

    .btn-transfer {
      background: var(--accent-soft);
      border: 1px solid transparent;
      color: var(--accent);
      padding: 7px 14px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      font-weight: 500;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-transfer:hover { border-color: var(--accent); }

    /* ── TABS ── */
    .tabs {
      display: flex;
      padding: 16px 28px 0;
      gap: 6px;
      border-bottom: 1px solid var(--border);
      background: transparent;
    }

    .tab {
      padding: 9px 18px;
      border-radius: var(--radius) var(--radius) 0 0;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      background: transparent;
      border: 1px solid transparent;
      border-bottom: none;
      font-family: inherit;
      transition: color 0.15s, background 0.15s;
    }
    .tab:hover { color: var(--text); }
    .tab.active {
      color: var(--accent);
      font-weight: 600;
      background: var(--surface);
      border-color: var(--border);
      margin-bottom: -1px;
    }

    /* ── CONTENT ── */
    .content {
      padding: 28px;
      max-width: 1440px;
      margin: 0 auto;
    }

    /* ── KPIs ── */
    .kpis {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 22px;
    }

    .kpi {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
    }

    .kpi-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .kpi-value {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.6px;
      font-variant-numeric: tabular-nums;
    }
    .kpi-value.pos { color: var(--green-bright); }
    .kpi-value.neg { color: var(--red-bright); }
    .kpi-delta { font-size: 11px; margin-top: 5px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .kpi-delta.pos { color: var(--green-bright); }
    .kpi-delta.neg { color: var(--red-bright); }
    .kpi-delta.neu { color: var(--muted); }

    /* ── FILTER BAR ── */
    .filter-bar { display: flex; align-items: center; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
    .filter-sep { width: 1px; height: 18px; background: var(--border); margin: 0 4px; align-self: center; }
    .fbtn {
      padding: 5px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      font-weight: 500;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      transition: border-color .15s, color .15s, background .15s;
    }
    .fbtn:hover { border-color: var(--accent); color: var(--accent); }
    .fbtn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ── CHARTS ── */
    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 16px 10px;
    }
    .chart-card.full { grid-column: 1 / -1; }

    .chart-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 10px;
      font-weight: 500;
    }

    /* ── SECTION ── */
    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 14px;
      overflow: hidden;
    }

    .section-head {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .section-title { font-size: 13px; font-weight: 600; letter-spacing: -0.1px; }

    .xfer-dir {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
    }
    .xfer-in { color: var(--green-bright); }
    .xfer-out { color: var(--muted); }

    /* ── TABLE ── */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }

    th {
      background: var(--surface2);
      color: var(--muted);
      font-weight: 500;
      padding: 9px 14px;
      text-align: left;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 9px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: var(--surface2); }

    /* ── BADGES ── */
    .badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .b-gasto        { background: #FDEBEC; color: #9F2F2D; }
    .b-ingreso      { background: #EDF3EC; color: #346538; }
    .b-nomina       { background: #E1F3FE; color: #1F6C9F; }
    .b-devolucion   { background: #EDF3EC; color: #346538; }
    .b-apuestas     { background: #FBF3DB; color: #956400; }
    .b-apuestasr    { background: #EDF3EC; color: #346538; }
    .b-inversion    { background: #EEE9FD; color: #5B2EBB; }
    .b-inversionr   { background: #EDF3EC; color: #346538; }
    .b-transferencia{ background: #F2F1EE; color: #57574F; }
    .b-saldo        { background: #E1F3FE; color: #1F6C9F; }

    /* ── FORM ── */
    .form-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 16px 18px;
    }

    .fg { display: flex; flex-direction: column; gap: 5px; }
    .fg.full { grid-column: 1 / -1; }

    label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input, select {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 8px 11px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      width: 100%;
      transition: border-color 0.15s;
    }
    /* Firefox: tipografía web en el control rompe popups nativos de select/date */
    select,
    input[type="date"] {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      appearance: auto;
    }
    input[type="date"] {
      min-height: 38px;
      position: relative;
      z-index: 2;
    }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    select option { background: var(--surface2); color: var(--text); }

    /* ── MOVEMENT SEARCH ── */
    .mov-search {
      display: flex;
      gap: 8px;
      padding: 10px 18px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      align-items: center;
    }
    .mov-search select, .mov-search input {
      width: auto;
      flex: 1 1 130px;
      min-width: 110px;
      padding: 6px 9px;
      font-size: 12px;
    }
    .mov-search .fbtn { flex: 0 0 auto; }
    .mov-count { font-size: 11px; color: var(--muted); }

    /* ── BUTTONS ── */
    .btn {
      padding: 8px 16px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      font-weight: 500;
      border: none;
      transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
    }
    .btn:hover { opacity: 0.88; }
    .btn:active { opacity: 0.72; transform: translateY(1px); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-danger  { background: #9F2F2D; color: #fff; }
    .btn-ghost   {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
    }

    /* ── QUICK-PICKS ── */
    .quick-picks { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .qpick {
      padding: 3px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      transition: border-color .15s, color .15s;
    }
    .qpick:hover { border-color: var(--ink); color: var(--ink); }

    /* ── AUTOCOMPLETE ── */
    .ac-wrap { position: relative; width: 100%; }
    .ac-drop {
      display: none;
      position: absolute;
      left: 0; right: 0; top: calc(100% + 4px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(0,0,0,.1);
      z-index: 50;
      max-height: 260px;
      overflow-y: auto;
    }
    .ac-drop.on { display: block; }
    .ac-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
    }
    .ac-item:hover, .ac-item.active { background: var(--surface2); }
    .ac-item .ac-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ac-item .ac-meta { flex-shrink: 0; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .ac-empty { padding: 10px 12px; font-size: 12px; color: var(--muted); }

    .concept-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; min-height: 0; }
    .chip {
      padding: 3px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-family: inherit;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: border-color .15s, background .15s;
    }
    .chip:hover { border-color: var(--ink); background: #ebeae6; }
    .chip .chip-n { color: var(--muted); margin-left: 4px; font-size: 10px; }
    .hint-total { font-size: 11px; color: var(--muted); margin-top: 4px; min-height: 16px; }
    .concepto-click {
      cursor: pointer;
      border-bottom: 1px dashed transparent;
      transition: border-color .15s, color .15s;
    }
    .concepto-click:hover { color: var(--blue); border-bottom-color: var(--blue); }

    /* ── BOTTOM GRID ── */
    .bottom-grid {
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 14px;
      align-items: start;
    }

    /* ── MODAL ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.72);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .overlay.on { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 380px;
      max-width: calc(100vw - 40px);
    }
    .modal h3 { font-size: 15px; margin-bottom: 18px; }
    .modal .fg { margin-bottom: 12px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 11px 18px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      z-index: 9999;
      transform: translateY(70px);
      opacity: 0;
      transition: transform .25s, opacity .25s;
      max-width: 360px;
    }
    .toast.on { transform: translateY(0); opacity: 1; }
    .toast.ok  { background: #dcfce7; border: 1px solid var(--green); color: var(--green-bright); }
    .toast.err { background: #fee2e2; border: 1px solid var(--red);   color: var(--red-bright); }

    /* ── MISC ── */
    .loading { padding: 60px; text-align: center; color: var(--muted); }
    .empty   { padding: 32px; text-align: center; color: var(--muted); font-size: 13px; }
    .num-pos { color: var(--green-bright); font-variant-numeric: tabular-nums; }
    .num-neg { color: var(--red-bright); font-variant-numeric: tabular-nums; }
    .r       { text-align: right; }
    .nowrap  { white-space: nowrap; }

    /* ── SECTION KPIs ── */
    .section-kpis { display:flex; border-bottom:1px solid var(--border); }
    .section-kpi { flex:1; padding:11px 16px; border-right:1px solid var(--border); }
    .section-kpi:last-child { border-right:none; }
    .section-kpi-label { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; font-weight:500; margin-bottom:5px; }
    .section-kpi-value { font-size:20px; font-weight:700; letter-spacing:-.3px; font-variant-numeric: tabular-nums; }
    .section-kpi-sub { font-size:11px; color:var(--muted); margin-top:3px; }
    .open-pos-header { padding:7px 14px 5px; font-size:10px; color:var(--ink); text-transform:uppercase; letter-spacing:.08em; font-weight:600; background:rgba(0,0,0,.03); }
    .closed-pos-header { padding:7px 14px 5px; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; font-weight:600; }

    .soft-alert {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      margin-bottom: 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 13px;
      color: var(--text);
    }
    .soft-alert.warn {
      border-color: #E8D5A8;
      background: #FBF7EE;
      color: #7A5B1E;
    }
    .soft-alert.ok {
      border-color: #C9DCC9;
      background: #F3F8F3;
      color: #346538;
    }
    .merchants-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .merchants-strip .mlabel {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-right: 4px;
    }
    .row-actions { display: flex; gap: 4px; justify-content: flex-end; flex-wrap: wrap; }
  </style>
</head>
<body class="acc-openbank">

<!-- HEADER -->
<header class="header">
  <div class="brand">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="8" fill="currentColor"/>
      <text x="16" y="22" text-anchor="middle" font-family="Outfit,system-ui,sans-serif" font-size="15" font-weight="700" fill="#fff">C</text>
    </svg>
    <h1>Cuentas</h1>
  </div>
  <div class="patrimonio-pill" id="patrimonio-pill">—</div>
  <div class="spacer"></div>
  <button class="btn-transfer" onclick="openModal()">⇄ Transferencia</button>
</header>

<!-- TABS -->
<div class="tabs">
  <button class="tab active" onclick="switchAccount('openbank', this)">
    <span class="tab-inner">
      <svg class="mark mark-sm" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#8B5E3C"/><text x="16" y="21" text-anchor="middle" font-family="Outfit,system-ui,sans-serif" font-size="11" font-weight="700" fill="#fff">OB</text></svg>
      Openbank
    </span>
  </button>
  <button class="tab" onclick="switchAccount('ibkr', this)">
    <span class="tab-inner">
      <svg class="mark mark-sm" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#2F5D50"/><text x="16" y="21" text-anchor="middle" font-family="Outfit,system-ui,sans-serif" font-size="11" font-weight="700" fill="#fff">IK</text></svg>
      IBKR
    </span>
  </button>
</div>

<!-- MAIN -->
<main class="content" id="main">
  <div class="loading">Cargando...</div>
</main>

<!-- TRANSFER MODAL -->
<div class="overlay" id="modal">
  <div class="modal">
    <h3>⇄ Transferencia entre cuentas</h3>
    <div class="fg">
      <label>Origen</label>
      <select id="t-origen" onchange="swapDestino(this)">
        <option value="openbank">Openbank</option>
        <option value="ibkr">IBKR</option>
      </select>
    </div>
    <div class="fg">
      <label>Destino</label>
      <select id="t-destino">
        <option value="ibkr">IBKR</option>
        <option value="openbank">Openbank</option>
      </select>
    </div>
    <div class="fg">
      <label>Importe (€)</label>
      <input type="number" id="t-total" placeholder="0.00" step="0.01" min="0.01">
    </div>
    <div class="fg">
      <label>Fecha</label>
      <input type="date" id="t-fecha" class="date-input">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="submitTransfer()">Transferir</button>
    </div>
  </div>
</div>

<!-- CLOSE POSITION MODAL -->
<div class="overlay" id="close-pos-modal">
  <div class="modal">
    <h3 id="cp-title">Cerrar cartera</h3>
    <div style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:16px;display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:12px;color:var(--muted)">Concepto</span>
        <b id="cp-concepto" style="font-size:13px;text-align:right;max-width:200px"></b>
      </div>

<script>
// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let account = 'openbank';
let data = [];
let panelFilters = {
  kpi:           { type: 'mes' },
  saldo:         { type: '3m' },
  mensual:       { type: '3m' },
  gastos:        { type: '3m' },

  carteras:      { type: '3m' },
  transferencias:{ type: '3m' },
};
let movSearch = { tipo: '', concepto: '', fecha: '' };
let gastosMode = 'media';
let carterasMode = 'total';
let closeModalState = { tipo: null, concepto: null, monto: 0 };
let editModalState = { idx: null };

const TIPOS_NEGATIVOS = new Set(['Gasto', 'Apuestas', 'Inversión', 'Transferencia']);
const TIPOS_INGRESO   = new Set(['Ingreso', 'Nómina', 'Saldo Inicial', 'Devolución', 'Apuestas_r', 'Inversión_r']);
const TIPOS_POR_CUENTA = {
  openbank: ['Gasto', 'Devolución', 'Ingreso', 'Nómina', 'Apuestas', 'Apuestas_r', 'Transferencia'],
  ibkr:     ['Gasto', 'Ingreso', 'Inversión', 'Inversión_r']
};
const BADGE_MAP = {
  'Gasto': 'gasto', 'Ingreso': 'ingreso', 'Nómina': 'nomina',
  'Devolución': 'devolucion', 'Apuestas': 'apuestas', 'Apuestas_r': 'apuestasr',
  'Inversión': 'inversion', 'Inversión_r': 'inversionr',

};
const DISPLAY_TIPO = { 'Inversión_r': 'Retorno inv.', 'Apuestas_r': 'Cobro apuesta' };
const displayTipo = t => DISPLAY_TIPO[t] || t;

function baseLayout() {

    paper_bgcolor: '#ffffff',
    plot_bgcolor:  '#ffffff',

    margin: { l: 50, r: 16, t: 10, b: 36 },
    xaxis: { gridcolor: 'rgba(0,0,0,0.07)', tickfont: { color: '#57606a', size: 10 } },

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  setToday('t-fecha');
  // Cerrar autocomplete sin mutar el DOM en el mismo tick del clic:
  // en Firefox, queryClose() síncrono cancela popups nativos de <select> y <input type="date">.
  document.addEventListener('pointerdown', e => {
    if (e.target.closest('.ac-wrap')) return;
    if (isNativePopupControl(e.target)) return;
    scheduleAcClose();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      acClose();
      if (document.getElementById('edit-mov-modal')?.classList.contains('on')) closeEditModal();
      else if (document.getElementById('close-pos-modal')?.classList.contains('on')) closeCloseModal();
      else if (document.getElementById('modal')?.classList.contains('on')) closeModal();
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      if (document.getElementById('edit-mov-modal')?.classList.contains('on')) submitEdit();
      else if (document.getElementById('add-form')) submitMov();
    }
  });
  await Promise.all([loadPatrimonio(), loadAccount('openbank')]);
});

function isNativePopupControl(el) {
  if (!el || !el.closest) return false;
  const node = el.closest('select, input[type="date"], option');
  return !!node;
}

let _acCloseTimer;
function scheduleAcClose() {
  clearTimeout(_acCloseTimer);
  _acCloseTimer = setTimeout(() => acClose(), 0);
}

// ─────────────────────────────────────────────
// ACCOUNT
// ─────────────────────────────────────────────

  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));

  await loadAccount(acc);
}

function setAccountTheme(acc) {
  document.body.classList.remove('acc-openbank', 'acc-ibkr');

}

async function loadAccount(acc) {
  setAccountTheme(acc);
  document.getElementById('main').innerHTML = '<div class="loading">Cargando...</div>';
  try {
    const res = await fetch(`/api/data/${acc}`);
    data = await res.json();
    await render(acc, data);
  } catch {
    document.getElementById('main').innerHTML = '<div class="loading">Error al cargar los datos.</div>';
  }

// ─────────────────────────────────────────────
// PATRIMONIO
// ─────────────────────────────────────────────
async function loadPatrimonio() {
  try {
    const { openbank, ibkr } = await (await fetch('/api/patrimonio')).json();
    const total = (openbank || 0) + (ibkr || 0);
    document.getElementById('patrimonio-pill').innerHTML =
      `Total <b>${eur(total)}</b> — OB ${eur(openbank)} · IB ${eur(ibkr)}`;
  } catch {}
}

// ─────────────────────────────────────────────
// FILTER (per panel — never triggers full re-render)
// Calendar months: 1m = este mes; 3m = mes actual + 2 anteriores; 6m = mes actual + 5 anteriores
// ─────────────────────────────────────────────
function calendarMonthStart(monthsBack) {
  const d = new Date();
  const start = new Date(d.getFullYear(), d.getMonth() - monthsBack, 1);
  const y = start.getFullYear();
  const m = String(start.getMonth() + 1).padStart(2, '0');
  return `${y}-${m}-01`;
}

function monthsBackForFilter(type) {
  if (type === '1m') return 0;
  if (type === '3m') return 2;
  if (type === '6m') return 5;
  return null;
}

function filterCutoff(f) {
  if (!f || f.type === 'all') return null;
  if (f.type === 'year') return { mode: 'year', year: String(f.year) };
  const back = monthsBackForFilter(f.type);
  if (back == null) return null;
  return { mode: 'from', cutoff: calendarMonthStart(back) };
}

function rowInFilter(fecha, f) {
  const c = filterCutoff(f);
  if (!c) return true;
  if (c.mode === 'year') return fecha.startsWith(c.year);
  return fecha >= c.cutoff;
}

function applyFilter(rows, f) {
  if (!f || f.type === 'all') return rows;
  return rows.filter(r => rowInFilter(r.Fecha, f));
}

function applyFilterByCloseDate(rows, f) {
  if (!f || f.type === 'all') return rows;
  return rows.filter(r => rowInFilter(r.fr, f));
}

function panelFilterBar(panel, allRows) {
  const c1m = calendarMonthStart(0);
  const c3m = calendarMonthStart(2);
  const c6m = calendarMonthStart(5);
  const has1m = allRows.some(r => r.Fecha >= c1m);
  const has3m = allRows.some(r => r.Fecha >= c3m);
  const has6m = allRows.some(r => r.Fecha >= c6m);
  const years = [...new Set(allRows.map(r => r.Fecha.slice(0, 4)))].sort();
  const f = panelFilters[panel] || { type: 'all' };

  const fb = (label, type, year) => {
    const act = (f.type === type && (year === undefined || year === f.year)) ? 'active' : '';
    const oc  = year !== undefined
      ? `setPanelFilter('${panel}','year',${year})`
      : `setPanelFilter('${panel}','${type}')`;
    return `<button class="fbtn ${act}" onclick="${oc}">${label}</button>`;
  };

  return [
    fb('Todo', 'all'),
    has6m ? fb('6 meses', '6m') : '',
    has3m ? fb('3 meses', '3m') : '',
    has1m ? fb('Mes', '1m') : '',
    years.length > 1 ? years.map(y => fb(y, 'year', parseInt(y))).join('') : (years[0] ? fb(years[0], 'year', parseInt(years[0])) : ''),
  ].join('');
}

function setPanelFilter(panel, type, year) {
  panelFilters[panel] = year !== undefined ? { type, year } : { type };
  refreshPanel(panel);
}

function setGastosMode(mode) {
  gastosMode = mode;
  document.querySelectorAll('.gastos-mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  chartGastos(applyFilter(data, panelFilters.gastos));
}

function setCarterasMode(mode) {
  carterasMode = mode;
  document.querySelectorAll('.carteras-mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  chartCarteras(applyFilter(data, panelFilters.carteras));
}

async function refreshPanel(panel) {
  const filtered = applyFilter(data, panelFilters[panel]);
  const pfEl = document.getElementById(`pf-${panel}`);
  if (pfEl) pfEl.innerHTML = panelFilterBar(panel, data);

  if (panel === 'saldo') {
    chartSaldo(filtered);
  } else if (panel === 'mensual') {
    chartMensual(filtered);
  } else if (panel === 'gastos') {
    chartGastos(filtered);
    chartDonut(filtered);
  } else if (panel === 'carteras') {
    chartCarteras(filtered);
  } else if (panel === 'transferencias') {
    const el = document.getElementById('transferencias-body');
    if (el) el.innerHTML = transferenciasBody(filtered);
  } else if (panel === 'apuestas') {
    const el = document.getElementById('apuestas-body');
    if (el) el.innerHTML = apuestasBody(await fetchRangeReport('/api/accounts/openbank/apuestas', panelFilters.apuestas));
  } else if (panel === 'inversiones') {
    const el = document.getElementById('inversiones-body');
    if (el) el.innerHTML = inversionesBody(filtered);
  }
}

// ─────────────────────────────────────────────
// MOVEMENT SEARCH
// ─────────────────────────────────────────────
function isSearchActive() {
  return !!(movSearch.tipo || movSearch.concepto || movSearch.fecha);
}

function searchedMovs() {
  let res = data;
  if (movSearch.tipo)     res = res.filter(r => r.Tipo === movSearch.tipo);
  if (movSearch.concepto) res = res.filter(r => r.Concepto.toLowerCase().includes(movSearch.concepto.toLowerCase()));
  if (movSearch.fecha)    res = res.filter(r => r.Fecha.slice(0, 10) === movSearch.fecha);
  res = [...res].sort((a, b) => b.Fecha.localeCompare(a.Fecha));
  return isSearchActive() ? res.slice(0, 500) : res.slice(0, 20);
}

function onSearchChange() {
  movSearch.tipo     = (document.getElementById('s-tipo')     || {}).value || '';
  movSearch.concepto = ((document.getElementById('s-concepto') || {}).value || '').trim();
  movSearch.fecha    = ((document.getElementById('s-fecha')    || {}).value || '').trim();
  refreshMovTable();
}

function clearSearch() {
  movSearch = { tipo: '', concepto: '', fecha: '' };
  ['s-tipo', 's-concepto', 's-fecha'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
  onSearchChange();
}

function filterByConcept(concepto) {
  const el = document.getElementById('s-concepto');
  if (!el) return;
  el.value = concepto;
  movSearch.concepto = concepto;
  onSearchChange();
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function refreshMovTable() {
  const movs = searchedMovs();
  const el = document.getElementById('movimientos-body');
  if (el) el.innerHTML = renderMovimientos(movs);
  const cnt = document.getElementById('mov-count');
  if (cnt) cnt.textContent = isSearchActive() ? `${movs.length} resultado(s)` : 'Últimos 20';
}

function deltaHtml(d, inverse = false) {
  if (!d) return '';
  const goodDir = inverse ? d.diff <= 0 : d.diff >= 0;
  if (d.diff === 0) return `<div class="kpi-delta neu">= igual al período anterior</div>`;
  const cls   = goodDir ? 'pos' : 'neg';
  const arrow = d.diff > 0 ? '↑' : '↓';
  const sign  = d.diff > 0 ? '+' : '';
  return `<div class="kpi-delta ${cls}">${arrow} ${sign}${eur(d.diff)} vs ant.</div>`;
}

function kpiLabel() {
  const t = panelFilters.kpi.type;
  if (t === 'trimestre') return 'últimos 3 meses';
  if (t === 'año') return 'este año';
  return 'este mes';
}

function kpiCardsHtml(kpi) {
  const lbl = kpiLabel();
  return `
    <div class="kpi">
      <div class="kpi-label">Saldo actual</div>
      <div class="kpi-value">${eur(kpi.saldo)}</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Ingresos · ${lbl}</div>
      <div class="kpi-value pos">${eur(kpi.ingresos)}</div>
      ${deltaHtml(kpi.ingresosDelta, false)}
    </div>
    <div class="kpi">
      <div class="kpi-label">Gastos · ${lbl}</div>
      <div class="kpi-value neg">${eur(kpi.gastos)}</div>
      ${deltaHtml(kpi.gastosDelta, true)}
    </div>
    <div class="kpi">
      <div class="kpi-label">Balance · ${lbl}</div>
      <div class="kpi-value ${kpi.balance >= 0 ? 'pos' : 'neg'}">${eur(kpi.balance)}</div>
      ${deltaHtml(kpi.balanceDelta, false)}
    </div>
  `;
}

async function fetchAccountKpis(cuenta, period) {
  const res = await fetch(`/api/accounts/${cuenta}/kpis?period=${encodeURIComponent(period)}`);
  return res.json();
}

async function fetchRangeReport(path, f) {
  const params = new URLSearchParams({ range: (f && f.type) || 'all' });
  if (f && f.year !== undefined) params.set('year', f.year);
  const res = await fetch(`${path}?${params}`);
  return res.json();
}

async function setKpiFilter(type) {
  panelFilters.kpi = { type };

    b.classList.toggle('active', b.dataset.kpi === type);

}

        </div>

            <div class="fg full">

                <input type="text" id="f-concepto" placeholder="Empieza a escribir…" autocomplete="off"

                <div class="ac-drop" id="ac-f-concepto"></div>

            </div>
            <div class="fg full">

              <div class="quick-picks">
                ${[50, 100, 200, 500, 1000].map(v => `<button type="button" class="qpick" onclick="setTotal(${v})">${v}€</button>`).join('')}
              </div>
            </div>
            <div class="fg full">
              <button type="button" class="btn btn-primary" style="width:100%" onclick="submitMov()">Guardar</button>
            </div>
          </div>
        </div>
      </div>`;
}

// KPIs
// ─────────────────────────────────────────────
function periodSlices(kpiType) {
  if (kpiType === 'trimestre') {
    const cut  = calendarMonthStart(2);
    const cut2 = calendarMonthStart(5);
    return {
      inCurr: r => r.Fecha >= cut,
      inPrv:  r => r.Fecha >= cut2 && r.Fecha < cut,
      inCurrFr: r => r.fr >= cut,
      inPrvFr:  r => r.fr >= cut2 && r.fr < cut,
    };
  }
  if (kpiType === 'año') {
    const y  = new Date().getFullYear().toString();
    const py = (new Date().getFullYear() - 1).toString();
    return {
      inCurr: r => r.Fecha.startsWith(y),
      inPrv:  r => r.Fecha.startsWith(py),
      inCurrFr: r => r.fr.startsWith(y),
      inPrvFr:  r => r.fr.startsWith(py),
    };
  }
  const m  = monthKey(0);
  const pm = monthKey(-1);
  return {
    inCurr: r => r.Fecha.slice(0, 7) === m,
    inPrv:  r => r.Fecha.slice(0, 7) === pm,
    inCurrFr: r => r.fr.slice(0, 7) === m,
    inPrvFr:  r => r.fr.slice(0, 7) === pm,
  };
}

function isTransferIn(r) {
  if (r.Tipo !== 'Ingreso') return false;
  const c = (r.Concepto || '').toLowerCase();
  return c.includes('desde openbank') || c.includes('desde ob');
}

function isTransferOut(r) {
  if (r.Tipo === 'Transferencia') return true;
  const c = (r.Concepto || '').toLowerCase();
  return c.includes('a openbank') || c.includes('a ob');
}

function ibkrTransfers(rows) {
  return rows
    .filter(r => isTransferIn(r) || isTransferOut(r))
    .map(r => ({
      ...r,
      dir: isTransferIn(r) ? 'in' : 'out',
      label: isTransferIn(r) ? '← Openbank' : '→ Openbank',
    }))
    .sort((a, b) => b.Fecha.localeCompare(a.Fecha));
}

function openCarterasSnapshot(allRows) {
  const allInv = allRows.filter(r => r.Tipo === 'Inversión');
  const closed = new Set(allRows.filter(r => r.Tipo === 'Inversión_r').map(r => r.Concepto));
  const open = allInv.filter(r => !closed.has(r.Concepto));
  const groups = groupBy(open, 'Concepto');
  const count = Object.keys(groups).length;
  const total = r2(Object.values(groups).reduce((s, rs) => s + sumC(rs), 0));
  return { count, total };
}

function computeIbkrKPIs(allRows) {
  const sorted = [...allRows].sort((a, b) => a.Fecha.localeCompare(b.Fecha));
  const saldo  = sorted.length ? sorted.at(-1).Saldo : 0;
  const slices = periodSlices(panelFilters.kpi.type);
  const open   = openCarterasSnapshot(allRows);

  const aportado = rs => {
    let rec = 0, sent = 0;
    for (const r of rs) {
      if (isTransferIn(r)) rec += r.Total;
      else if (isTransferOut(r)) sent += r.Total;
    }
    return r2(rec - sent);
  };
  const currA = aportado(allRows.filter(slices.inCurr));
  const prvA  = aportado(allRows.filter(slices.inPrv));

  const closed = computeInversiones(allRows);
  const pnl = list => r2(list.reduce((s, r) => s + r.bal, 0));
  const currP = pnl(closed.filter(slices.inCurrFr));
  const prvP  = pnl(closed.filter(slices.inPrvFr));

  const mk = (c, p) => ({ diff: r2(c - p) });
  return {
    saldo,
    aportado: currA, aportadoDelta: mk(currA, prvA),
    enCarteras: open.total, enCarterasCount: open.count,
    pnl: currP, pnlDelta: mk(currP, prvP),
  };
}

function monthKey(offset = 0) {
  const d = new Date();
  const start = new Date(d.getFullYear(), d.getMonth() + offset, 1);
  return `${start.getFullYear()}-${String(start.getMonth() + 1).padStart(2, '0')}`;
}

function gastoSumForMonth(ym) {
  return r2(data.filter(r => r.Tipo === 'Gasto' && r.Fecha.slice(0, 7) === ym)
    .reduce((s, r) => s + (r.Total || 0), 0));
}

function gastoAlertHtml() {
  const cur = monthKey(0);
  const curTotal = gastoSumForMonth(cur);
  const prev = [monthKey(-1), monthKey(-2), monthKey(-3)].map(gastoSumForMonth);
  const withData = prev.filter(v => v > 0);
  if (!withData.length || curTotal <= 0) return '';
  const avg = r2(withData.reduce((a, b) => a + b, 0) / withData.length);
  if (avg <= 0) return '';
  const diff = r2(curTotal - avg);
  const pct = r2((diff / avg) * 100);
  if (diff <= 0) {
    return `<div class="soft-alert ok">Gastos este mes ${eur(curTotal)} · ${Math.abs(pct).toFixed(0)}% por debajo de la media de los ${withData.length} meses anteriores (${eur(avg)})</div>`;
  }
  return `<div class="soft-alert warn">Gastos este mes ${eur(curTotal)} · ${pct.toFixed(0)}% por encima de la media de los ${withData.length} meses anteriores (${eur(avg)})</div>`;
}

function topMerchantsHtml() {
  const cur = monthKey(0);
  const by = {};
  for (const r of data) {
    if (r.Tipo !== 'Gasto' || r.Fecha.slice(0, 7) !== cur) continue;
    by[r.Concepto] = (by[r.Concepto] || 0) + r.Total;
  }
  const top = Object.entries(by).sort((a, b) => b[1] - a[1]).slice(0, 8);
  if (!top.length) return '';
  return `<div class="merchants-strip">
    <span class="mlabel">Top del mes</span>
    ${top.map(([c, t]) =>
      `<button type="button" class="chip" title="${escAttr(c)}" data-c="${escAttr(c)}" onclick="filterByConcept(this.dataset.c)">${esc(c)} <span class="chip-n">${eur(t)}</span></button>`
    ).join('')}
  </div>`;
}

function chartSaldo(rows) {

  const dates  = sorted.map(r => r.Fecha);
  const saldos = sorted.map(r => r.Saldo);
  const actual = saldos.at(-1) || 0;
  const L = baseLayout();
  const lineColor = account === 'ibkr' ? '#2F5D50' : '#0969da';

  const traces = [{
    x: dates, y: saldos, type: 'scatter', mode: 'lines',
    name: `Saldo (${eur(actual)})`,
    line: { color: lineColor, width: 2.5 },
    hovertemplate: '%{x|%d/%m/%y}: <b>%{y:,.2f}€</b><extra></extra>'
  }];

  // Media móvil solo en Openbank (cuenta activa); en IBKR sobra
  if (account !== 'ibkr') {
    const media = rollingMean(saldos, dates, 30);
    traces.push({
      x: dates, y: media, type: 'scatter', mode: 'lines',
      name: 'Media 30d',
      line: { color: '#cf222e', width: 1.5, dash: 'dash' },
      opacity: 0.7,
      hovertemplate: '%{y:,.2f}€<extra>Media 30d</extra>'
    });
  }

  Plotly.newPlot('c-saldo', traces, {
    ...L,
    xaxis: { ...L.xaxis, type: 'date' },
    yaxis: { ...L.yaxis, ticksuffix: '€', zeroline: true, zerolinecolor: 'rgba(0,0,0,.1)' }
  }, { responsive: true, displayModeBar: false });
}

function chartMensual(rows) {
  const byMes = {};
  for (const r of rows) {
    const m = r.Fecha.slice(0, 7);
    if (!byMes[m]) byMes[m] = { ing: 0, gas: 0 };
    if (TIPOS_INGRESO.has(r.Tipo) && r.Tipo !== 'Saldo Inicial') byMes[m].ing += r.Total;
    else if (TIPOS_NEGATIVOS.has(r.Tipo)) byMes[m].gas += r.Total;
  }
  const meses = Object.keys(byMes).sort();
  const ing   = meses.map(m => r2(byMes[m].ing));
  const gas   = meses.map(m => r2(byMes[m].gas));
  const bal   = meses.map((_, i) => r2(ing[i] - gas[i]));
  const L = baseLayout();

  Plotly.newPlot('c-mensual', [
    {
      x: meses, y: ing, type: 'bar', name: 'Ingresos',
      marker: { color: 'rgba(26,127,55,.65)' },
      hovertemplate: '%{y:,.2f}€<extra>Ingresos</extra>'
    },
    {
      x: meses, y: gas.map(g => -g), type: 'bar', name: 'Gastos',
      marker: { color: 'rgba(207,34,46,.55)' },
      customdata: gas,
      hovertemplate: '%{customdata:,.2f}€<extra>Gastos</extra>'

    {
      x: meses, y: bal, type: 'scatter', mode: 'lines+markers',
      name: 'Balance',
      line: { color: '#9a6700', width: 2, dash: 'dot' },
      marker: { size: 5 },
      hovertemplate: '%{y:,.2f}€<extra>Balance</extra>'

    ...L,
    barmode: 'overlay',
    xaxis: { ...L.xaxis, type: 'category' },
    yaxis: { ...L.yaxis, ticksuffix: '€', zeroline: true, zerolinecolor: 'rgba(0,0,0,.1)' }

}

function chartGastos(rows) {
  const gastos = rows.filter(r => r.Tipo === 'Gasto' && r.Total != null && !isNaN(r.Total));
  if (!gastos.length) { Plotly.purge('c-gastos'); return; }

  const byConcepto = {};
  for (const r of gastos) {
    if (!byConcepto[r.Concepto]) byConcepto[r.Concepto] = 0;
    byConcepto[r.Concepto] += r.Total;
  }

  const gf = panelFilters.gastos;
  let nMonths;
  if (!gf || gf.type === 'all' || gf.type === 'year') {
    nMonths = new Set(gastos.map(r => r.Fecha.slice(0, 7))).size || 1;
  } else if (gf.type === '1m') {
    nMonths = 1;
  } else if (gf.type === '3m') {
    nMonths = 3;
  } else {
    nMonths = 6;
  }

  let entries, hoverSuffix;
  if (gastosMode === 'media') {
    entries = Object.entries(byConcepto)
      .map(([c, total]) => [c, r2(total / nMonths)])
      .filter(([, avg]) => avg > 0)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 20)
      .reverse();
    hoverSuffix = '€/mes';
  } else {
    entries = Object.entries(byConcepto)
      .map(([c, total]) => [c, r2(total)])

  }], {
    ...L,
    hovermode: 'closest',
    margin: { l: 140, r: 120, t: 10, b: 36 },
    xaxis: { ...L.xaxis, type: 'linear', ticksuffix: '€', range: [0, maxV * 1.45] },
    yaxis: { ...L.yaxis, automargin: true, ticks: 'outside', ticklen: 14, tickcolor: 'rgba(0,0,0,0)',
             tickfont: { color: '#24292f', size: 13 } },

}

function rollingMean(vals, dates, days) {
  const ms = days * 86400000;
  return vals.map((_, i) => {
    const cut = new Date(dates[i]).getTime() - ms;
    let s = 0, n = 0;
    for (let j = 0; j <= i; j++) {
      if (new Date(dates[j]).getTime() >= cut) { s += vals[j]; n++; }
    }
    return n ? s / n : vals[i];
  });
}

function computeInversiones(rows) {
  const groups = groupBy(rows.filter(r => r.Tipo === 'Inversión' || r.Tipo === 'Inversión_r'), 'Concepto');
  const out = [];
  for (const [c, rs] of Object.entries(groups)) {
    const inv      = rs.filter(r => r.Tipo === 'Inversión');
    const retornos = rs.filter(r => r.Tipo === 'Inversión_r');
    if (!retornos.length) continue;
    const invertido = sumC(inv);
    const devuelto  = sumC(retornos);
    const bal       = r2(devuelto - invertido);
    const roi       = invertido > 0 ? r2(bal / invertido * 100) : 0;
    out.push({ Concepto: c, fi: minD(inv), fr: maxD(retornos), invertido: r2(invertido), devuelto: r2(devuelto), bal, roi });
  }
  out.sort((a, b) => a.fr.localeCompare(b.fr));
  let bH = 0, iAcum = 0;
  for (const r of out) {
    bH    = r2(bH + r.bal);
    iAcum = r2(iAcum + r.invertido);
    r.balH = bH;
    r.roiH = iAcum > 0 ? r2(bH / iAcum * 100) : 0;
  }
  return out;
}

// ─────────────────────────────────────────────
// CONCEPT STATS + SMART AUTOCOMPLETE
// ─────────────────────────────────────────────
let acState = { id: null, items: [], active: -1 };

function conceptStats(rows) {
  const map = new Map();
  for (const r of rows) {
    if (!r.Concepto || r.Tipo === 'Saldo Inicial') continue;
    let e = map.get(r.Concepto);
    if (!e) {
      e = { concepto: r.Concepto, count: 0, lastFecha: r.Fecha };
      map.set(r.Concepto, e);
    }
    e.count++;
    if (r.Fecha >= e.lastFecha) e.lastFecha = r.Fecha;
  }
  return [...map.values()];
}

function rankConcepts(stats, query) {
  const q = (query || '').trim().toLowerCase();
  const byFreq = (a, b) => b.count - a.count || b.lastFecha.localeCompare(a.lastFecha) || a.concepto.localeCompare(b.concepto, 'es');
  if (!q) return [...stats].sort(byFreq);
  const prefix = [], contains = [];
  for (const s of stats) {
    const low = s.concepto.toLowerCase();
    if (low.startsWith(q)) prefix.push(s);
    else if (low.includes(q)) contains.push(s);
  }
  prefix.sort(byFreq);
  contains.sort(byFreq);
  return [...prefix, ...contains];
}

function conceptCandidates(inputId) {
  if (inputId === 's-concepto') {
    let rows = data;
    if (movSearch.tipo) rows = rows.filter(r => r.Tipo === movSearch.tipo);
    return conceptStats(rows);
  }
  if (inputId === 'e-concepto') {
    const tipo = (document.getElementById('e-tipo') || {}).value;
    return candidatesForTipo(tipo, editModalState.idx);
  }
  const tipo = (document.getElementById('f-tipo') || {}).value;
  return candidatesForTipo(tipo, null);
}

function candidatesForTipo(tipo, excludeIdx) {
  if (!tipo) return [];
  if (tipo === 'Apuestas_r') {
    const casadas = new Set(data.filter(r => r.Tipo === 'Apuestas_r' && r._idx !== excludeIdx).map(r => r.Concepto));
    const abiertas = new Set(data.filter(r => r.Tipo === 'Apuestas' && !casadas.has(r.Concepto)).map(r => r.Concepto));
    return conceptStats(data.filter(r => r.Tipo === 'Apuestas' && abiertas.has(r.Concepto)));
  }
  if (tipo === 'Inversión_r') {
    const cerradas = new Set(data.filter(r => r.Tipo === 'Inversión_r' && r._idx !== excludeIdx).map(r => r.Concepto));
    const abiertas = new Set(data.filter(r => r.Tipo === 'Inversión' && !cerradas.has(r.Concepto)).map(r => r.Concepto));
    return conceptStats(data.filter(r => r.Tipo === 'Inversión' && abiertas.has(r.Concepto)));
  }
  if (tipo === 'Devolución') {
    return conceptStats(data.filter(r => r.Tipo === 'Gasto'));
  }
  return conceptStats(data.filter(r => r.Tipo === tipo));
}

function suggestNextApuesta() {
  const re = /^(.*?)(\d+)\s*$/;
  const bets = data.filter(r => r.Tipo === 'Apuestas').map(r => r.Concepto);
  const byPrefix = new Map();
  for (const c of bets) {
    const m = c.match(re);
    if (!m) continue;
    const pref = m[1], n = parseInt(m[2], 10);
    const prev = byPrefix.get(pref);
    if (!prev || n > prev.n) byPrefix.set(pref, { n, digits: m[2].length, ejemplo: c });
  }
  let best = null;
  for (const [pref, info] of byPrefix) {
    const next = pref + String(info.n + 1).padStart(info.digits, '0');
    if (bets.includes(next)) continue;
    const count = bets.filter(c => c.startsWith(pref)).length;
    if (!best || count > best.count) best = { concepto: next, count, lastFecha: '', suggested: true };
  }
  return best;
}

function acClose() {
  document.querySelectorAll('.ac-drop.on').forEach(el => el.classList.remove('on'));
  acState = { id: null, items: [], active: -1 };
}

function acOnInput(inputId) {
  const input = document.getElementById(inputId);
  const drop  = document.getElementById('ac-' + inputId);
  if (!input || !drop) return;
  const ranked = rankConcepts(conceptCandidates(inputId), input.value).slice(0, 10);
  // Para Apuestas vacías: sugerir siguiente número
  if (inputId === 'f-concepto' && (document.getElementById('f-tipo') || {}).value === 'Apuestas' && !input.value.trim()) {
    const next = suggestNextApuesta();
    if (next && !ranked.some(r => r.concepto === next.concepto)) ranked.unshift(next);
  }
  acState = { id: inputId, items: ranked, active: ranked.length ? 0 : -1 };
  if (!ranked.length) {
    drop.innerHTML = `<div class="ac-empty">${input.value.trim() ? 'Sin coincidencias' : 'Sin historial aún'}</div>`;
    drop.classList.add('on');
    return;
  }
  drop.innerHTML = ranked.map((s, i) =>
    `<div class="ac-item ${i === acState.active ? 'active' : ''}" onmousedown="event.preventDefault();acPick(${i})">
      <span class="ac-name">${esc(s.concepto)}</span>
    </div>`
  ).join('');
  drop.classList.add('on');
}

function acOnKey(e, inputId) {
  const drop = document.getElementById('ac-' + inputId);
  if (!drop || !drop.classList.contains('on')) {
    if (e.key === 'ArrowDown') { acOnInput(inputId); e.preventDefault(); }
    if (e.key === 'Enter' && inputId === 'f-concepto' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submitMov(); }
    return;
  }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    acState.active = Math.min(acState.active + 1, acState.items.length - 1);
    acHighlight();
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    acState.active = Math.max(acState.active - 1, 0);
    acHighlight();
  } else if (e.key === 'Enter') {
    if (acState.active >= 0) { e.preventDefault(); acPick(acState.active); }
  } else if (e.key === 'Escape') {
    e.preventDefault();
    acClose();
  }
}

function acHighlight() {
  const drop = document.getElementById('ac-' + acState.id);
  if (!drop) return;
  drop.querySelectorAll('.ac-item').forEach((el, i) => el.classList.toggle('active', i === acState.active));
  const active = drop.querySelector('.ac-item.active');
  if (active) active.scrollIntoView({ block: 'nearest' });
}

function acPick(i) {
  const item = acState.items[i];
  const id = acState.id;
  if (!item || !id) return;
  const input = document.getElementById(id);
  if (!input) return;
  input.value = item.concepto;
  acClose();
  if (id === 'f-concepto') {
    document.getElementById('f-total')?.focus();
  } else if (id === 's-concepto') {
    onSearchChange();
  }
}

  const fecha    = document.getElementById('f-fecha').value;
  const tipo     = document.getElementById('f-tipo').value;

  if (!fecha)               { toast('Introduce una fecha', 'err'); return; }
  if (!concepto)            { toast('Introduce un concepto', 'err'); return; }
  if (!total || total <= 0) { toast('Introduce un importe válido', 'err'); return; }
  try {
    const res  = await fetch(`/api/movimiento/${account}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fecha, tipo, concepto, total })
    });
    const body = await res.json();
    if (!res.ok) { toast(body.error || 'Error al guardar', 'err'); return; }
    toast(`Guardado · Saldo: ${eur(body.saldo)}`, 'ok');
    await Promise.all([loadAccount(account), loadPatrimonio()]);
  } catch { toast('Error de conexión', 'err'); }
}

async function deleteLast() {
  const sorted = [...data].sort((a, b) => a.Fecha.localeCompare(b.Fecha));
  if (!sorted.length) return;
  const last = sorted.at(-1);
  if (!confirm(`¿Borrar el último movimiento?\n\n${fd(last.Fecha)} · ${last.Tipo} · ${last.Concepto} · ${last.Total}€`)) return;
  try {
    const res  = await fetch(`/api/movimiento/${account}`, { method: 'DELETE' });
    const body = await res.json();
    if (!res.ok) { toast(body.error || 'Error al borrar', 'err'); return; }
    toast(`Borrado · Saldo: ${eur(body.saldo)}`, 'ok');
    await Promise.all([loadAccount(account), loadPatrimonio()]);
  } catch { toast('Error de conexión', 'err'); }
}

// ─────────────────────────────────────────────
// EDIT MOVEMENT MODAL
// ─────────────────────────────────────────────
function openEditModal(idx) {
  const row = data.find(r => r._idx === idx);
  if (!row || row.Tipo === 'Saldo Inicial') return;
  editModalState = { idx };
  const sel = document.getElementById('e-tipo');
  sel.innerHTML = TIPOS_POR_CUENTA[account]
    .map(t => `<option value="${t}" ${t === row.Tipo ? 'selected' : ''}>${displayTipo(t)}</option>`)
    .join('');
  document.getElementById('e-fecha').value = fd(row.Fecha);
  document.getElementById('e-concepto').value = row.Concepto;
  document.getElementById('e-total').value = Number(row.Total).toFixed(2);
  acClose();
  document.getElementById('edit-mov-modal').classList.add('on');
}

function closeEditModal() {
  acClose();
  document.getElementById('edit-mov-modal').classList.remove('on');
  editModalState = { idx: null };
}

function onEditTipoChange() {
  acClose();
}

async function submitEdit() {
  const idx = editModalState.idx;
  if (idx == null) return;
  const tipo     = document.getElementById('e-tipo').value;
  const concepto = document.getElementById('e-concepto').value.trim();
  const total    = parseFloat(document.getElementById('e-total').value);
  if (!concepto)            { toast('Introduce un concepto', 'err'); return; }
  if (!total || total <= 0) { toast('Introduce un importe válido', 'err'); return; }
  try {
    const res  = await fetch(`/api/movimiento/${account}`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ idx, tipo, concepto, total })
    });
    const body = await res.json();
    if (!res.ok) { toast(body.error || 'Error al editar', 'err'); return; }
    closeEditModal();
    toast(`Actualizado · Saldo: ${eur(body.saldo)}`, 'ok');
    await Promise.all([loadAccount(account), loadPatrimonio()]);
  } catch { toast('Error de conexión', 'err'); }
}

// ─────────────────────────────────────────────
// CLOSE POSITION MODAL
// ─────────────────────────────────────────────
function openCloseModal(btn) {
  const tipo     = btn.dataset.tipo;
  const concepto = btn.dataset.concepto;
  const monto    = parseFloat(btn.dataset.monto);
  closeModalState = { tipo, concepto, monto };
  document.getElementById('cp-title').textContent     = tipo === 'Apuestas' ? 'Cerrar apuesta' : 'Cerrar cartera';
  document.getElementById('cp-concepto').textContent  = concepto;
  document.getElementById('cp-monto').textContent     = eur(monto);
  document.getElementById('cp-tipo-label').textContent = tipo === 'Apuestas' ? 'Banca' : 'Capital';
  document.getElementById('cp-total').value = '';
  setToday('cp-fecha');
  document.getElementById('close-pos-modal').classList.add('on');
}

function closeCloseModal() {
  document.getElementById('close-pos-modal').classList.remove('on');
}

async function submitClosePosition() {
  const total = parseFloat(document.getElementById('cp-total').value);
  const fecha = document.getElementById('cp-fecha').value;
  if (!fecha)         { toast('Introduce una fecha de cierre', 'err'); return; }
  if (isNaN(total) || total < 0) { toast('Introduce el importe recibido (0 si es pérdida total)', 'err'); return; }
  const tipoR = closeModalState.tipo === 'Apuestas' ? 'Apuestas_r' : 'Inversión_r';
  const acc   = closeModalState.tipo === 'Apuestas' ? 'openbank'   : 'ibkr';
  const capital = closeModalState.monto || 0;
  const bal = r2(total - capital);
  const roi = capital > 0 ? r2(bal / capital * 100) : 0;
  try {
    const res  = await fetch(`/api/movimiento/${acc}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fecha, tipo: tipoR, concepto: closeModalState.concepto, total })
    });
    const body = await res.json();
    if (!res.ok) { toast(body.error || 'Error al guardar', 'err'); return; }
    closeCloseModal();
    if (tipoR === 'Inversión_r') {
      toast(`Cartera cerrada · ROI ${roi.toFixed(1)}% (${eur(bal)}) · Saldo: ${eur(body.saldo)}`, 'ok');
    } else {
      toast(`Apuesta cerrada · ${eur(bal)} · Saldo: ${eur(body.saldo)}`, 'ok');
    }
    await Promise.all([loadAccount(account), loadPatrimonio()]);
  } catch { toast('Error de conexión', 'err'); }
}

// ─────────────────────────────────────────────
// TRANSFER MODAL
// ─────────────────────────────────────────────
function openModal()  { document.getElementById('modal').classList.add('on'); setToday('t-fecha'); }
function closeModal() { document.getElementById('modal').classList.remove('on'); }

function swapDestino(sel) {
  document.getElementById('t-destino').value = sel.value === 'openbank' ? 'ibkr' : 'openbank';
}

async function submitTransfer() {
  const origen  = document.getElementById('t-origen').value;
  const destino = document.getElementById('t-destino').value;
  const total   = parseFloat(document.getElementById('t-total').value);
  const fecha   = document.getElementById('t-fecha').value;
  if (!total || total <= 0) { toast('Introduce un importe válido', 'err'); return; }
  if (!fecha)               { toast('Introduce una fecha', 'err'); return; }
  if (origen === destino)   { toast('Origen y destino deben ser distintos', 'err'); return; }
  try {
    const res  = await fetch('/api/transferencia', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ origen, destino, total, fecha })
    });
    const body = await res.json();
    if (!res.ok) { toast(body.error || 'Error', 'err'); return; }
    closeModal();
    document.getElementById('t-total').value = '';
    toast(`Transferencia registrada · ${eur(body.saldo_origen)} → ${eur(body.saldo_destino)}`, 'ok');
    await Promise.all([loadAccount(account), loadPatrimonio()]);
  } catch { toast('Error de conexión', 'err'); }
}

// ─────────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────────
const eur      = v => (isFinite(v) ? v : 0).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '€';
const r2       = v => Math.round(v * 100) / 100;
const fd       = s => { if (!s) return '—'; const [y, mo, d] = s.replace('T', ' ').split(' ')[0].split('-').map(Number); return new Date(y, mo - 1, d).toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' }); };
const escAttr  = s => String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const esc      = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function groupBy(arr, key) {
  return arr.reduce((acc, r) => { (acc[r[key]] = acc[r[key]] || []).push(r); return acc; }, {});
}
const sumC  = arr => arr.reduce((s, r) => s + (r.Total || 0), 0);
const minD  = arr => arr.reduce((m, r) => !m || r.Fecha < m ? r.Fecha : m, null) || '';
const maxD  = arr => arr.reduce((m, r) => !m || r.Fecha > m ? r.Fecha : m, null) || '';

function localISODate() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function setToday(id) {
  const el = document.getElementById(id);
  if (el) el.value = localISODate();
}

let _toastTimer;
function toast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast ${type} on`;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('on'), 3500);
}
</script>
