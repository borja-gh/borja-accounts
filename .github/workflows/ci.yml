name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  python-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: uv sync
      - run: uv run python -c "import app"
      - run: uv run pytest tests/golden_master -v
